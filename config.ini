[llama]
# Path to the GGUF model file (relative to CodeLens root or absolute)
model_path = models\Qwen3.5-9B.Q4_K_M.gguf

# llama-server settings
port = 8080
host = 127.0.0.1
context_size = 16384
gpu_layers = 999
batch_size = 512
ubatch_size = 256
parallel = 2
cache_type_k = q8_0
cache_type_v = q8_0
cache_reuse = 4000
reasoning_format = none

[web]
# Web app settings
host = 127.0.0.1
port = 8765

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO
